# ClearVue ERP Connector Interface — v1 (CLEAN TARGET, DRAFT)
#
# This is the clean, consumer-driven target contract — designed from what ClearVue
# SaaS actually consumes, NOT ported from the legacy adaptor's as-built shapes.
# The connector emits these canonical names directly, so a stock deployment needs
# no SaaS-side field mapping.
#
# DRAFT — two gates before this is locked:
#   1. CONSUMER VALIDATION: confirm every field below is actually read by a ClearVue
#      feature/UI. Drop anything no consumer uses (no gold-plating).
#   2. 11.6 FEASIBILITY: confirm every shape here is producible by an OpenEdge 11.6 /
#      PASOE connector within the latency budget. See docs/feasibility-11.6.md.
#      In particular, the nested cover-sheet envelope must serialize cleanly from a
#      ProDataset (the legacy adaptor faked it with fragile string-munging — the 11.6
#      design must do it natively or the shape changes).
#
# Legacy reference (as-built shapes + the working MFG/PRO query joins) lives in the
# ClearVueSaaS repo and the Interact ClearVueAdaptor — used for query logic, not shape.
#
# Design decisions baked in (differ deliberately from the legacy adaptor):
#   - Field names are ClearVue-canonical (PartNumber, OperationNumber, UnitOfMeasure…)
#     so stock output == SaaS model == identity.
#   - Domain is CONNECTOR CONFIGURATION, not a request param (one connector instance
#     serves one ERP domain). Legacy hardcoded "MPI"; here it's configured, not passed.
#     It is NEVER on the wire.
#   - Query params use ClearVue BUSINESS vocabulary, not ERP vocabulary (SOL-51):
#     `partNumber` (the part identifier) and `facility`. `facility` carries the
#     EXTERNAL FACILITY CODE the ERP uses to identify the location (a string, e.g.
#     "1000") — NOT a ClearVue facility Guid. The connector maps that external
#     facility code to the MFG/PRO site internally, so no ERP term ("site") crosses
#     the wire. See docs/contract-vocabulary.md.
#   - Auth is an ENFORCED header (legacy used an unenforced query param).
#   - `Reference` (the legacy cover-sheet "Refinance" typo is fixed).
#   - Structured ERROR model (code + category + retryable + correlationId + safe diagnostic)
#     so ClearVue can auto-retry transient ERP-DB drops and support can assist the client.
#   - The connector AUTO-RECONNECTS on client/server DB drops (the MFG/PRO DB is restarted
#     often); a structured error is returned only when reconnect fails within budget.
#     See docs/resilience-and-errors.md.

openapi: 3.0.3

info:
  title: ClearVue ERP Connector Interface
  version: 1.0.0-draft
  description: >
    Live, read-only, single-record ERP lookups consumed by ClearVue SaaS and served
    by an on-prem connector (first implementation: OpenEdge 11.6 / PASOE against QAD
    MFG/PRO). Synchronous GETs; no write-back. Canonical field names — the connector
    emits exactly what ClearVue's models expect.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: SolvePoint Solutions — ClearVue

servers:
  - url: http://{host}:{port}/{basePath}
    description: On-prem connector base URL (configured in the ClearVue ConnectorAgent)
    variables:
      host: { default: connector-host }
      port: { default: "8820" }
      basePath: { default: clearvue/erp/v1 }

security:
  - BearerAuth: []

tags:
  - name: health
  - name: lookups

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness / readiness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { service: "clearvue-openedge-connector", version: "1.0.0", erpReachable: true }

  /product-structure:
    get:
      tags: [lookups]
      operationId: getProductStructure
      summary: Product structure (BOM) for a part at a facility
      description: >
        Returns the requested part as a root ("Parent") row followed by its
        exploded BOM components. The root row is ALWAYS present when the part
        exists in the ERP (pt_mstr). A part that exists but has no BOM (e.g. a
        purchased or raw part) returns 200 with ONLY the root row — this is a
        valid result, not a 404. 404 is reserved strictly for a part that does
        not exist in the ERP. The root row's Quantity is 1 by convention (the
        root has no quantity-per-parent; 1 keeps column arithmetic safe).
      parameters:
        - $ref: "#/components/parameters/PartNumber"
        - $ref: "#/components/parameters/Facility"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: >
            The part exists. The array always contains the root ("Parent") row,
            followed by any exploded BOM components. For a part with no BOM the
            array contains only that single root row (it is never an empty array
            and never a 404).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StructureComponent" }
              examples:
                withComponents:
                  summary: Multi-level BOM (root + exploded children)
                  value:
                    - { Level: Parent, PartNumber: PUMP-ASSY-100, Reference: null, AltPartNumber: DRW-100-A, Revision: B, Description: "Centrifugal Pump Assembly", Quantity: 1, UnitOfMeasure: EA }
                    - { Level: "1", PartNumber: HOUSING-100, Reference: "010", AltPartNumber: DRW-100-H, Revision: A, Description: "Pump Housing, Cast", Quantity: 1, UnitOfMeasure: EA }
                    - { Level: "1", PartNumber: IMPELLER-50, Reference: "020", AltPartNumber: null, Revision: C, Description: "Impeller, 50mm", Quantity: 1, UnitOfMeasure: EA }
                    - { Level: ".2", PartNumber: GASKET-KIT, Reference: "030", AltPartNumber: null, Revision: null, Description: "Item not in inventory", Quantity: 2.5, UnitOfMeasure: null }
                rootOnlyNoBom:
                  summary: Part exists but has no BOM (root row only — still 200)
                  value:
                    - { Level: Parent, PartNumber: HOUSING-100, Reference: null, AltPartNumber: DRW-100-H, Revision: A, Description: "Pump Housing, Cast", Quantity: 1, UnitOfMeasure: EA }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ErpError" }
        "503": { $ref: "#/components/responses/ErpUnavailable" }
        "504": { $ref: "#/components/responses/ErpTimeout" }

  /product-route:
    get:
      tags: [lookups]
      operationId: getProductRoute
      summary: Routing for a part at a site
      parameters:
        - $ref: "#/components/parameters/Part"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Routing rows (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RouteStep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ErpError" }
        "503": { $ref: "#/components/responses/ErpUnavailable" }
        "504": { $ref: "#/components/responses/ErpTimeout" }

  /product-cover-sheet:
    get:
      tags: [lookups]
      operationId: getProductCoverSheet
      summary: Combined cover sheet (header + structure + route + comments)
      description: >
        The richest operation and the feasibility bellwether — prove this one
        end-to-end on 11.6 first. The cover-sheet route rows carry two extra fields
        (PiecesPerHour, WorkCenterDescription) that the standalone route omits.
      parameters:
        - $ref: "#/components/parameters/Part"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Cover sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoverSheet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ErpError" }
        "503": { $ref: "#/components/responses/ErpUnavailable" }
        "504": { $ref: "#/components/responses/ErpTimeout" }

  # /part — DEFERRED decision (SOL-53). The cover sheet already returns part header
  # fields; add a standalone part lookup only if a consumer needs it. Not in v1 draft.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Enforced shared secret / token in the Authorization header. (The legacy
        adaptor used an unenforced query-string key — not carried forward.)

  parameters:
    # ClearVue business-vocabulary params (SOL-51) — used by /product-structure.
    PartNumber:
      name: partNumber
      in: query
      required: true
      description: The part identifier — the part number to look up in the ERP.
      schema: { type: string, maxLength: 50 }
    Facility:
      name: facility
      in: query
      required: true
      description: >
        The EXTERNAL FACILITY CODE the ERP uses to identify the location — a string
        code (e.g. "1000"). This is NOT a ClearVue facility Guid; it is the code the
        target ERP recognizes for the location. The connector maps this facility code
        to the MFG/PRO site internally, so no ERP-specific term crosses the wire.
      schema: { type: string, maxLength: 20 }
    # Legacy ERP-vocabulary params — still referenced by the DRAFT /product-route and
    # /product-cover-sheet endpoints (not yet built). SOL-51 aligned /product-structure
    # to partNumber/facility above; aligning the remaining draft endpoints is a follow-up
    # (see docs/contract-vocabulary.md) to be done when those endpoints are implemented.
    Part:
      name: part
      in: query
      required: true
      description: ERP part number.
      schema: { type: string, maxLength: 50 }
    Site:
      name: site
      in: query
      required: true
      description: ERP site / plant number.
      schema: { type: string, maxLength: 20 }
    CorrelationId:
      name: correlationId
      in: query
      required: false
      description: >
        Optional caller-supplied correlation id. When absent the connector GENERATES one
        (a GUID). Either way it is echoed in the Error body and keys the connector's
        server-side raw-diagnostic log line, so ClearVue and connector logs can be
        matched for support.
      schema: { type: string }

  responses:
    BadRequest:
      description: Missing/invalid parameter (400)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: BAD_REQUEST, category: REQUEST, retryable: false, message: "partNumber is required" }
    Unauthorized:
      description: Missing/invalid credentials (401)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNAUTHORIZED, category: AUTH, retryable: false }
    NotFound:
      description: >
        The part does not exist in the ERP (404). For /product-structure this
        means the part is absent from pt_mstr. NOTE: a part that exists but has
        no BOM is NOT a 404 — it returns 200 with only the root row.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: NOT_FOUND, category: DATA, retryable: false, message: "part PUMP-XYZ not found in ERP for facility 1000" }
    ErpUnavailable:
      description: >
        ERP database unreachable — transient (503, retryable). `code` is `ERP_DISCONNECTED`
        when an existing client/server connection dropped (e.g. DB restart) and reconnect did
        not succeed in budget, or `ERP_UNAVAILABLE` when the DB host/broker cannot be reached
        at all. ClearVue treats both identically (category ERP_CONNECTIVITY, retryable). The
        connector auto-reconnects on DB-restart drops; this is returned only when reconnection
        did not succeed in time.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: ERP_DISCONNECTED
            category: ERP_CONNECTIVITY
            retryable: true
            retryAfterSeconds: 5
            message: "ERP database is restarting; retry shortly."
            correlationId: "6f1f2c1e-9d1a-4b7e-8f3a-2c1d0e9b7a55"
            diagnostic: "upstream ERP connection could not be re-established within the retry budget; retry shortly"
    ErpTimeout:
      description: Query exceeded the connector's time budget (504, retryable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: ERP_TIMEOUT, category: ERP_CONNECTIVITY, retryable: true, retryAfterSeconds: 3 }
    ErpError:
      description: ERP query failed for a non-connectivity reason (502)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: ERP_QUERY_ERROR, category: INTERNAL, retryable: false }

  schemas:
    Health:
      type: object
      required: [service]
      properties:
        service:     { type: string }
        version:     { type: string }
        erpReachable: { type: boolean, description: "Optional: did a lightweight DB probe succeed?" }

    Error:
      type: object
      required: [code, category, retryable]
      properties:
        code:
          type: string
          description: Stable machine code.
          enum: [BAD_REQUEST, UNAUTHORIZED, NOT_FOUND, ERP_DISCONNECTED, ERP_UNAVAILABLE, ERP_TIMEOUT, ERP_QUERY_ERROR, INTERNAL]
        category:
          type: string
          description: Coarse class that routes ClearVue handling and support assistance.
          enum: [REQUEST, AUTH, DATA, ERP_CONNECTIVITY, INTERNAL]
        message:
          type: string
          description: Human-readable, sanitized — never credentials, PII, or raw ERP internals.
        retryable:
          type: boolean
          description: >
            True when the caller may retry — transient conditions, chiefly the ERP DB
            restarting / reconnecting. ClearVue may auto-retry these so a DB bounce is
            invisible to the user.
        retryAfterSeconds:
          type: integer
          nullable: true
          description: Hint for how long to wait before retrying a retryable error.
        correlationId:
          type: string
          description: >
            Echoes the request correlation id (connector-generated when the caller sent
            none) so SaaS and connector logs match for support — the connector's
            server-side log carries the full raw diagnostic keyed by this id.
        timestamp:
          type: string
          format: date-time
        diagnostic:
          type: string
          nullable: true
          description: >
            Optional SAFE operator-facing hint to guide assistance — e.g. "upstream ERP
            connection could not be re-established within the retry budget". Sanitized:
            never secrets/PII, and never infrastructure topology (no db name, no class
            name, no Progress error number). The raw detail lives only in the connector's
            server-side log, keyed by correlationId.

    # Canonical = ClearVue SaaS model property names → stock output is identity.
    StructureComponent:
      type: object
      required: [PartNumber]
      description: >
        One row of a product structure. The first row is the root ("Parent")
        row for the requested part; subsequent rows are its exploded components.
      properties:
        Level:          { type: string, description: "Indent level; 'Parent' for the root row, then '1', '.2', '..3' … for explosion depth." }
        PartNumber:     { type: string }
        Reference:      { type: string, description: "Reference designator (legacy 'Refinance' typo fixed)." }
        AltPartNumber:  { type: string }
        Revision:       { type: string }
        Description:    { type: string }
        Quantity:
          type: number
          format: double
          description: >
            Quantity-per-parent for a component row. For the root ("Parent") row
            this is 1 by convention (the root has no quantity-per-parent; 1 keeps
            arithmetic over the column safe). Non-nullable.
        UnitOfMeasure:  { type: string }

    RouteStep:
      type: object
      required: [OperationNumber]
      properties:
        OperationNumber:   { type: string }
        StandardOperation: { type: string }
        Description:       { type: string }
        WorkCenterId:      { type: string }
        Machine:           { type: string }
        StartDate:         { type: string, format: date, nullable: true }
        EndDate:           { type: string, format: date, nullable: true }
        SetupHours:        { type: number, format: double }
        RunHoursPerPiece:  { type: number, format: double }
        Wait:              { type: number, format: double }
        Move:              { type: number, format: double }
        YieldPercent:      { type: number, format: double }
        Tool:              { type: string }
        # Cover-sheet route only (null/omitted on standalone /product-route):
        PiecesPerHour:         { type: number, format: double, nullable: true }
        WorkCenterDescription: { type: string, nullable: true }

    CoverSheetHeader:
      type: object
      properties:
        ShipTo:         { type: string }
        ShipName:       { type: string }
        PartNumber:     { type: string }
        AltPartNumber:  { type: string }
        Revision:       { type: string }
        Description:    { type: string }
        Bom:            { type: string }
        CustItem:       { type: string }
        RouteCode:      { type: string }
        QtyPallet:      { type: string }
        Note1:  { type: string, nullable: true }
        Note2:  { type: string, nullable: true }
        Note3:  { type: string, nullable: true }
        Note4:  { type: string, nullable: true }
        Note5:  { type: string, nullable: true }
        Note6:  { type: string, nullable: true }
        Note7:  { type: string, nullable: true }
        Note8:  { type: string, nullable: true }
        Note9:  { type: string, nullable: true }
        Note10: { type: string, nullable: true }

    CoverSheet:
      type: object
      required: [PartNumber]
      properties:
        PartNumber: { type: string }
        Header:     { $ref: "#/components/schemas/CoverSheetHeader" }
        Structure:
          type: array
          items: { $ref: "#/components/schemas/StructureComponent" }
        Route:
          type: array
          items: { $ref: "#/components/schemas/RouteStep" }
        Comments:
          type: array
          items: { type: string }
